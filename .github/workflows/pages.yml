name: Pages

# Builds the Jekyll documentation site in docs/ and publishes it to GitHub
# Pages. Runs only when docs/ (or this file) changes on main, or by hand.
#
# One-time setup in the repository: Settings -> Pages -> Source = "GitHub
# Actions". Without that the deploy job fails with a "not enabled" error.
#
# This workflow builds a static site only. It never builds a Docker image and
# never brings a container up, so the devlog guards that scan
# .github/workflows for deploy paths do not apply to it.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
